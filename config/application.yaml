# アプリケーションの基本設定
app:
  # データを取得する間隔（例: 5min, 1hour）
  interval: "5min"

# 取引関連の設定
trading:
  # 取引する通貨ペア（例: BTC, ETH）
  symbol: "BTC"
  # 初期資金
  initial_capital: 10000
  # 1回の取引額
  trade_amount: 1000
  # 買い注文を出す閾値（例: 0.005 は 0.5%）
  buy_threshold: 0.005
  # 売り注文を出す閾値（例: 0.005 は 0.5%）
  sell_threshold: 0.005

# 外部API関連の設定
api:
  # APIリクエスト失敗時の再試行回数
  retry_count: 3

# データ出力関連の設定
output:
  # 取引履歴を出力するCSVファイルのパス
  output_path: "data/trades.csv"
  # アプリケーションの状態を保存するJSONファイルのパス
  state_path: "data/state.json"
