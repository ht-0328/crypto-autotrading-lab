# アプリケーションの基本設定
app:
  # データを取得する間隔（例: 5min, 1hour）
  interval: "5min"
  # 現在の開発フェーズ。実注文が許可されるのは Phase3 以降で、
  # それ未満では real_trade_enabled=true を指定しても起動時に失敗する
  phase: 1

# リアル取引関連の設定
# 上限値の決定理由と、まだ実装されていない安全ルール（1日の損失上限、連敗停止、
# 許容スリッページ）は docs/overview/roadmap.md の「安全ルール（数値）」を正とする。
real_trading:
  dry_run: true
  real_trade_enabled: false
  stop_on_unconfirmed_order: true
  # 1回あたりの注文金額の上限（円）
  max_order_jpy: 10000
  # 1日の累計注文金額の上限（円）
  max_daily_order_jpy: 20000
  # 保有金額と注文予定額の合計の上限（円）
  max_position_jpy: 10000
  # 取引所が定める最小注文数量と注文数量の刻み。
  # GMOコインの GET /public/v1/symbols で確認できる（2026-08-29 時点の BTC の値）。
  # 刻みに合わない数量を送ると注文が拒否されるため、実注文には必須。
  min_order_size: 0.00001
  size_step: 0.00001
  # 成行注文の手数料率。上限の判定に含める（GMOコインの BTC の takerFee）
  taker_fee_rate: 0.0005
  # 許容するスリッページ。K線の終値と最新価格の乖離、
  # および約定価格と発注時の想定価格の乖離の両方に使う。
  # 値の根拠は docs/overview/roadmap.md の「安全ルール（数値）」
  max_slippage_rate: 0.005
  # 自動で停止する条件。手動の承認を置かないため、負けが込んだときは
  # システム自身が止まる必要がある。値の根拠は docs/overview/roadmap.md の
  # 「安全ルール（数値）」。いずれも新規の買いだけを止め、売りは止めない。
  # 日付が変われば解除される。
  max_daily_loss_jpy: 2000
  max_consecutive_losses: 3

# 取引関連の設定
trading:
  # ATR計算に使用するK線の数
  atr_length: 14
  # ATR利確倍率
  atr_profit_multiplier: 2.0
  # ATR損切り倍率
  atr_loss_multiplier: 2.0
  # 実取引で許可するのは SafeReboundStrategy のみ。クールダウンを使う Strategy は
  # 実注文の売りで lastStopLossTime を更新しないため、クールダウンが機能しない。
  # 詳細は docs/overview/roadmap.md の「実取引で許可する設定」を参照。
  strategy_name: "SafeReboundStrategy"
  # 取引する通貨ペア（例: BTC, ETH）
  symbol: "BTC"
  # 初期資金
  initial_capital: 10000
  # 1回の取引額
  trade_amount: 1000
  # 注文サイズモード (FIXED_AMOUNT または ALL_IN)
  # 実取引で許可するのは FIXED_AMOUNT のみ。ALL_IN は1回の露出が読めない。
  # order_sizing_mode: "FIXED_AMOUNT"
  # 買い注文を出す閾値（例: 0.005 は 0.5%）
  buy_threshold: 0.005
  # 売り注文を出す閾値（例: 0.005 は 0.5%）
  sell_threshold: 0.005
  # ボラティリティの閾値（例: 0.003 は 0.3%）
  volatility_threshold: 0.003
  # 急変動の閾値（例: 0.01 は 1.0%）
  sharp_change_threshold: 0.01

# 外部API関連の設定
api:
  # APIリクエスト失敗時の再試行回数
  retry_count: 3
  # APIのベースURL（デフォルトはGMOコインのPublic API）
  public_base_url: "https://api.coin.z.com/public"
  private_base_url: "https://api.coin.z.com/private"

# データ出力関連の設定
output:
  # 取引履歴を出力するCSVファイル名
  output_path: "trades.csv"
  # アプリケーションの状態を保存するJSONファイル名
  state_path: "state.json"
