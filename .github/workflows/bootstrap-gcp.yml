name: Bootstrap GCP Resources

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Enable GCP APIs
        run: |
          echo "Enabling necessary GCP APIs..."
          gcloud services enable serviceusage.googleapis.com \
            iam.googleapis.com \
            iamcredentials.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            storage.googleapis.com

      - name: Create Artifact Registry
        run: |
          echo "Checking if Artifact Registry repository exists..."
          DESCRIBE_OUT=$(gcloud artifacts repositories describe ${{ vars.ARTIFACT_REPOSITORY }} --location=${{ vars.GCP_REGION }} 2>&1 || true)
          if echo "$DESCRIBE_OUT" | grep -q "NOT_FOUND"; then
            echo "Artifact Registry repository not found. Creating..."
            gcloud artifacts repositories create ${{ vars.ARTIFACT_REPOSITORY }} \
              --repository-format=docker \
              --location=${{ vars.GCP_REGION }}
          elif echo "$DESCRIBE_OUT" | grep -q "PERMISSION_DENIED"; then
            echo "Error: Permission denied to describe Artifact Registry. Please check your IAM roles."
            exit 1
          else
            echo "Artifact Registry repository already exists or another error occurred: $DESCRIBE_OUT"
          fi

      - name: Create GCS Bucket
        run: |
          echo "Checking if GCS Bucket exists..."
          DESCRIBE_OUT=$(gcloud storage buckets describe gs://${{ vars.GCS_BUCKET_NAME }} 2>&1 || true)
          if echo "$DESCRIBE_OUT" | grep -q "404" || echo "$DESCRIBE_OUT" | grep -q "does not exist"; then
            echo "GCS Bucket not found. Creating..."
            gcloud storage buckets create gs://${{ vars.GCS_BUCKET_NAME }} \
              --location=${{ vars.GCP_REGION }}
          elif echo "$DESCRIBE_OUT" | grep -q "403" || echo "$DESCRIBE_OUT" | grep -q "access to this bucket"; then
            echo "Error: Permission denied to describe GCS Bucket. Please check your IAM roles."
            exit 1
          else
            echo "GCS Bucket already exists or another error occurred: $DESCRIBE_OUT"
          fi

      - name: Create Cloud Build Service Account
        run: |
          SA_EMAIL="${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          echo "Checking if Cloud Build Service Account exists..."
          DESCRIBE_OUT=$(gcloud iam service-accounts describe $SA_EMAIL 2>&1 || true)
          if echo "$DESCRIBE_OUT" | grep -q "NOT_FOUND" || echo "$DESCRIBE_OUT" | grep -q "does not exist"; then
            echo "Cloud Build Service Account not found. Creating..."
            gcloud iam service-accounts create ${{ vars.BUILD_SERVICE_ACCOUNT_NAME }} \
              --description="Service Account for Cloud Build"

            echo "Waiting for service account to be available..."
            for i in {1..12}; do
              if gcloud iam service-accounts describe $SA_EMAIL > /dev/null 2>&1; then
                echo "Service account is now available."
                break
              fi
              echo "Still waiting... ($i/12)"
              sleep 5
            done
          elif echo "$DESCRIBE_OUT" | grep -q "PERMISSION_DENIED"; then
            echo "Error: Permission denied to describe Service Account. Please check your IAM roles."
            exit 1
          else
            echo "Cloud Build Service Account already exists or another error occurred: $DESCRIBE_OUT"
          fi

      - name: Create Cloud Run Runtime Service Account
        run: |
          SA_EMAIL="${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          echo "Checking if Cloud Run Runtime Service Account exists..."
          DESCRIBE_OUT=$(gcloud iam service-accounts describe $SA_EMAIL 2>&1 || true)
          if echo "$DESCRIBE_OUT" | grep -q "NOT_FOUND" || echo "$DESCRIBE_OUT" | grep -q "does not exist"; then
            echo "Cloud Run Runtime Service Account not found. Creating..."
            gcloud iam service-accounts create ${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }} \
              --description="Service Account for Cloud Run Job Runner"

            echo "Waiting for service account to be available..."
            for i in {1..12}; do
              if gcloud iam service-accounts describe $SA_EMAIL > /dev/null 2>&1; then
                echo "Service account is now available."
                break
              fi
              echo "Still waiting... ($i/12)"
              sleep 5
            done
          elif echo "$DESCRIBE_OUT" | grep -q "PERMISSION_DENIED"; then
            echo "Error: Permission denied to describe Service Account. Please check your IAM roles."
            exit 1
          else
            echo "Cloud Run Runtime Service Account already exists or another error occurred: $DESCRIBE_OUT"
          fi

      - name: Grant IAM Permissions to Service Accounts
        run: |
          echo "Granting IAM roles to Cloud Build Service Account..."
          gcloud projects add-iam-policy-binding ${{ vars.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/artifactregistry.writer"
          gcloud projects add-iam-policy-binding ${{ vars.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/logging.logWriter"
          gcloud projects add-iam-policy-binding ${{ vars.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/storage.objectViewer"

          echo "Granting IAM roles to Cloud Run Runtime Service Account..."
          gcloud storage buckets add-iam-policy-binding gs://${{ vars.GCS_BUCKET_NAME }} \
            --member="serviceAccount:${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/storage.objectAdmin"
