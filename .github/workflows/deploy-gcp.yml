name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      execute_after_deploy:
        description: 'デプロイ後に Cloud Run Job を実行する'
        required: false
        type: boolean
        default: false
      strategy_name:
        description: 'Trading strategy to use'
        required: false
        type: choice
        options:
          - SafeReboundStrategy
          - SimpleContrarianStrategy
        default: SafeReboundStrategy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          # 以下はGitHub Secrets/Variablesで設定すること
          # GCP_WORKLOAD_IDENTITY_PROVIDER: 例 "projects/1234567890/locations/global/workloadIdentityPools/my-pool/providers/my-provider"
          # GCP_DEPLOY_SERVICE_ACCOUNT: 例 "my-deploy-sa@crypto-autotrading-lab.iam.gserviceaccount.com"
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup GCP Resources
        run: |
          # 必要なGCP APIを有効化
          gcloud services enable serviceusage.googleapis.com \
            iam.googleapis.com \
            iamcredentials.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            storage.googleapis.com

          # Artifact Registry を作成（存在する場合はエラーを無視）
          gcloud artifacts repositories describe ${{ vars.ARTIFACT_REPOSITORY }} \
            --location=${{ vars.GCP_REGION }} || \
          gcloud artifacts repositories create ${{ vars.ARTIFACT_REPOSITORY }} \
            --repository-format=docker \
            --location=${{ vars.GCP_REGION }}

          # GCS バケットを作成（存在する場合はエラーを無視）
          gcloud storage buckets describe gs://${{ vars.GCS_BUCKET_NAME }} || \
          gcloud storage buckets create gs://${{ vars.GCS_BUCKET_NAME }} \
            --location=${{ vars.GCP_REGION }}

          # Cloud Build 用サービスアカウントを作成（存在する場合はエラーを無視）
          gcloud iam service-accounts describe ${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com || \
          gcloud iam service-accounts create ${{ vars.BUILD_SERVICE_ACCOUNT_NAME }} \
            --description="Service Account for Cloud Build"

          # Cloud Run 実行用サービスアカウントを作成（存在する場合はエラーを無視）
          gcloud iam service-accounts describe ${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com || \
          gcloud iam service-accounts create ${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }} \
            --description="Service Account for Cloud Run Job Runner"

          # Cloud Build 用サービスアカウントに権限を付与
          gcloud projects add-iam-policy-binding ${{ vars.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/artifactregistry.writer"
          gcloud projects add-iam-policy-binding ${{ vars.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/logging.logWriter"
          # Cloud Build でソースコードを GCS ステージングバケットから読み取るために必要な権限
          gcloud projects add-iam-policy-binding ${{ vars.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/storage.objectViewer"

          # Cloud Run 実行用サービスアカウントに権限を付与（対象バケットの Storage Object Admin）
          gcloud storage buckets add-iam-policy-binding gs://${{ vars.GCS_BUCKET_NAME }} \
            --member="serviceAccount:${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/storage.objectAdmin"

      - name: Build and Push Docker Image with Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_REGION=${{ vars.GCP_REGION }},_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},_ARTIFACT_REPOSITORY=${{ vars.ARTIFACT_REPOSITORY }},_IMAGE_NAME=${{ vars.IMAGE_NAME }},_SHORT_SHA=${{ env.SHORT_SHA }} \
            --service-account=projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            .

      - name: Deploy to Cloud Run Job
        run: |
          STRATEGY="${{ inputs.strategy_name || 'SafeReboundStrategy' }}"
          echo "Deploying Cloud Run Job with trading strategy: $STRATEGY"

          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${{ env.SHORT_SHA }}"

          ENV_VARS="APP_DATA_DIR=/mnt/gcs/data"
          ENV_VARS="${ENV_VARS},APP_TRADING_STRATEGY_NAME=${STRATEGY}"
          ENV_VARS="${ENV_VARS},API_BASE_URL=${{ vars.API_BASE_URL }}"
          ENV_VARS="${ENV_VARS},API_RETRY_COUNT=${{ vars.API_RETRY_COUNT }}"
          ENV_VARS="${ENV_VARS},APP_INTERVAL=${{ vars.APP_INTERVAL }}"
          ENV_VARS="${ENV_VARS},OUTPUT_PATH=${{ vars.OUTPUT_PATH }}"
          ENV_VARS="${ENV_VARS},STATE_PATH=${{ vars.STATE_PATH }}"
          ENV_VARS="${ENV_VARS},TRADING_BUY_THRESHOLD=${{ vars.TRADING_BUY_THRESHOLD }}"
          ENV_VARS="${ENV_VARS},TRADING_INITIAL_CAPITAL=${{ vars.TRADING_INITIAL_CAPITAL }}"
          ENV_VARS="${ENV_VARS},TRADING_SELL_THRESHOLD=${{ vars.TRADING_SELL_THRESHOLD }}"
          ENV_VARS="${ENV_VARS},TRADING_SHARP_CHANGE_THRESHOLD=${{ vars.TRADING_SHARP_CHANGE_THRESHOLD }}"
          ENV_VARS="${ENV_VARS},TRADING_SYMBOL=${{ vars.TRADING_SYMBOL }}"
          ENV_VARS="${ENV_VARS},TRADING_TRADE_AMOUNT=${{ vars.TRADING_TRADE_AMOUNT }}"
          ENV_VARS="${ENV_VARS},TRADING_VOLATILITY_THRESHOLD=${{ vars.TRADING_VOLATILITY_THRESHOLD }}"

          gcloud run jobs deploy ${{ vars.CLOUD_RUN_JOB_NAME }} \
            --image ${IMAGE_URI} \
            --region ${{ vars.GCP_REGION }} \
            --service-account ${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars "${ENV_VARS}" \
            --add-volume=name=gcs,type=cloud-storage,bucket=${{ vars.GCS_BUCKET_NAME }},readonly=false \
            --add-volume-mount=volume=gcs,mount-path=/mnt/gcs \
            --tasks 1 \
            --max-retries 0

      - name: Verify Deployment
        run: |
          gcloud run jobs describe ${{ vars.CLOUD_RUN_JOB_NAME }} \
            --region ${{ vars.GCP_REGION }}

          echo "=== Env Vars ==="
          gcloud run jobs describe ${{ vars.CLOUD_RUN_JOB_NAME }} \
            --region ${{ vars.GCP_REGION }} \
            --format='yaml(template.template.containers[0].env)'

      - name: Execute Cloud Run Job (Optional)
        if: ${{ inputs.execute_after_deploy }}
        run: |
          gcloud run jobs execute ${{ vars.CLOUD_RUN_JOB_NAME }} \
            --region ${{ vars.GCP_REGION }} \
            --wait
