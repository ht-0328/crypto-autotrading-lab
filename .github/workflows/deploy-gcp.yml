name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      execute_after_deploy:
        description: "デプロイ後に Cloud Run Job を実行する"
        required: false
        type: boolean
        default: false
      strategy_name:
        description: "Trading strategy to use"
        required: false
        type: choice
        options:
          - SafeReboundStrategy
          - CooldownReboundStrategy
          - TrendConfirmReboundStrategy
          - AtrTrendConfirmReboundStrategy
          - SimpleContrarianStrategy
        default: SafeReboundStrategy

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify GCP Resources Exist
        run: |
          echo "Verifying that necessary GCP resources exist..."

          echo "Checking Artifact Registry..."
          if ! gcloud artifacts repositories describe ${{ vars.ARTIFACT_REPOSITORY }} --location=${{ vars.GCP_REGION }} > /dev/null 2>&1; then
            echo "Error: Artifact Registry が存在しません。bootstrap-create-gcp.yml を先に実行してください。"
            exit 1
          fi

          echo "Checking GCS Bucket..."
          if ! gcloud storage buckets describe gs://${{ vars.GCS_BUCKET_NAME }} > /dev/null 2>&1; then
            echo "Error: GCS bucket が存在しません。bootstrap-create-gcp.yml を先に実行してください。"
            exit 1
          fi

          echo "Checking Cloud Build Service Account..."
          if ! gcloud iam service-accounts describe ${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com > /dev/null 2>&1; then
            echo "Error: Cloud Build用サービスアカウントが存在しません。bootstrap-create-gcp.yml を先に実行してください。"
            exit 1
          fi

          echo "Checking Cloud Run Runtime Service Account..."
          if ! gcloud iam service-accounts describe ${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com > /dev/null 2>&1; then
            echo "Error: Cloud Run実行用サービスアカウントが存在しません。bootstrap-create-gcp.yml を先に実行してください。"
            exit 1
          fi

          echo "All required resources verified successfully."
          echo "※ もしこれ以降のビルドやデプロイステップで権限エラー (Permission Denied) が発生する場合は、"
          echo "  bootstrap-grant-iam.yml の実行が漏れている可能性があります。確認してください。"

      - name: Build and Push Docker Image with Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_REGION=${{ vars.GCP_REGION }},_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},_ARTIFACT_REPOSITORY=${{ vars.ARTIFACT_REPOSITORY }},_IMAGE_NAME=${{ vars.IMAGE_NAME }},_SHORT_SHA=${{ env.SHORT_SHA }} \
            --service-account=projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            .

      - name: Deploy to Cloud Run Job
        run: |
          STRATEGY="${{ inputs.strategy_name || 'SafeReboundStrategy' }}"
          echo "Deploying Cloud Run Job with trading strategy: $STRATEGY"

          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${{ env.SHORT_SHA }}"

          ENV_VARS="APP_DATA_DIR=/mnt/gcs/data"
          ENV_VARS="${ENV_VARS},APP_TRADING_STRATEGY_NAME=${STRATEGY}"
          ENV_VARS="${ENV_VARS},API_PUBLIC_BASE_URL=${{ vars.API_PUBLIC_BASE_URL }}"
          ENV_VARS="${ENV_VARS},API_PRIVATE_BASE_URL=${{ vars.API_PRIVATE_BASE_URL }}"
          ENV_VARS="${ENV_VARS},API_RETRY_COUNT=${{ vars.API_RETRY_COUNT }}"
          ENV_VARS="${ENV_VARS},APP_INTERVAL=${{ vars.APP_INTERVAL }}"
          ENV_VARS="${ENV_VARS},OUTPUT_PATH=${{ vars.OUTPUT_PATH }}"
          ENV_VARS="${ENV_VARS},STATE_PATH=${{ vars.STATE_PATH }}"
          ENV_VARS="${ENV_VARS},TRADING_BUY_THRESHOLD=${{ vars.TRADING_BUY_THRESHOLD }}"
          ENV_VARS="${ENV_VARS},TRADING_INITIAL_CAPITAL=${{ vars.TRADING_INITIAL_CAPITAL }}"
          ENV_VARS="${ENV_VARS},TRADING_SELL_THRESHOLD=${{ vars.TRADING_SELL_THRESHOLD }}"
          ENV_VARS="${ENV_VARS},TRADING_SHARP_CHANGE_THRESHOLD=${{ vars.TRADING_SHARP_CHANGE_THRESHOLD }}"
          ENV_VARS="${ENV_VARS},TRADING_SYMBOL=${{ vars.TRADING_SYMBOL }}"
          ENV_VARS="${ENV_VARS},TRADING_TRADE_AMOUNT=${{ vars.TRADING_TRADE_AMOUNT }}"
          ENV_VARS="${ENV_VARS},TRADING_VOLATILITY_THRESHOLD=${{ vars.TRADING_VOLATILITY_THRESHOLD }}"
          ENV_VARS="${ENV_VARS},TRADING_COOLDOWN_LENGTH=${{ vars.TRADING_COOLDOWN_LENGTH }}"
          ENV_VARS="${ENV_VARS},TRADING_ATR_LENGTH=${{ vars.TRADING_ATR_LENGTH }}"
          ENV_VARS="${ENV_VARS},TRADING_ATR_PROFIT_MULTIPLIER=${{ vars.TRADING_ATR_PROFIT_MULTIPLIER }}"
          ENV_VARS="${ENV_VARS},TRADING_ATR_LOSS_MULTIPLIER=${{ vars.TRADING_ATR_LOSS_MULTIPLIER }}"
          ENV_VARS="${ENV_VARS},TRADING_ORDER_SIZING_MODE=${{ vars.TRADING_ORDER_SIZING_MODE }}"

          # 安全に関わる設定は、未設定なら安全側の値にする。
          # GitHub Actions の式で既定値を書くと、文字列 "false" の扱いが分かりにくいため
          # bash 側で解決する。
          APP_PHASE_VALUE="${{ vars.APP_PHASE }}"
          APP_PHASE_VALUE="${APP_PHASE_VALUE:-1}"
          REAL_TRADING_DRY_RUN_VALUE="${{ vars.REAL_TRADING_DRY_RUN }}"
          REAL_TRADING_DRY_RUN_VALUE="${REAL_TRADING_DRY_RUN_VALUE:-true}"
          REAL_TRADING_ENABLED_VALUE="${{ vars.REAL_TRADING_ENABLED }}"
          REAL_TRADING_ENABLED_VALUE="${REAL_TRADING_ENABLED_VALUE:-false}"
          NOTIFICATION_ENABLED_VALUE="${{ vars.NOTIFICATION_ENABLED }}"
          NOTIFICATION_ENABLED_VALUE="${NOTIFICATION_ENABLED_VALUE:-false}"

          echo "実注文に関わる設定: APP_PHASE=${APP_PHASE_VALUE}, dry_run=${REAL_TRADING_DRY_RUN_VALUE}, enabled=${REAL_TRADING_ENABLED_VALUE}"
          echo "通知の設定: enabled=${NOTIFICATION_ENABLED_VALUE}"

          ENV_VARS="${ENV_VARS},APP_PHASE=${APP_PHASE_VALUE}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_DRY_RUN=${REAL_TRADING_DRY_RUN_VALUE}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_ENABLED=${REAL_TRADING_ENABLED_VALUE}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_MAX_ORDER_JPY=${{ vars.REAL_TRADING_MAX_ORDER_JPY }}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_MAX_DAILY_ORDER_JPY=${{ vars.REAL_TRADING_MAX_DAILY_ORDER_JPY }}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_MAX_POSITION_JPY=${{ vars.REAL_TRADING_MAX_POSITION_JPY }}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_MIN_ORDER_SIZE=${{ vars.REAL_TRADING_MIN_ORDER_SIZE }}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_SIZE_STEP=${{ vars.REAL_TRADING_SIZE_STEP }}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_TAKER_FEE_RATE=${{ vars.REAL_TRADING_TAKER_FEE_RATE }}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_MAX_SLIPPAGE_RATE=${{ vars.REAL_TRADING_MAX_SLIPPAGE_RATE }}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_MAX_DAILY_LOSS_JPY=${{ vars.REAL_TRADING_MAX_DAILY_LOSS_JPY }}"
          ENV_VARS="${ENV_VARS},REAL_TRADING_MAX_CONSECUTIVE_LOSSES=${{ vars.REAL_TRADING_MAX_CONSECUTIVE_LOSSES }}"
          ENV_VARS="${ENV_VARS},NOTIFICATION_ENABLED=${NOTIFICATION_ENABLED_VALUE}"
          ENV_VARS="${ENV_VARS},NOTIFICATION_PAYLOAD_KEY=${{ vars.NOTIFICATION_PAYLOAD_KEY }}"

          # 秘密情報は環境変数の値として渡さず、Secret Manager から参照させる。
          # 必要なときだけ結び付ける。存在しないシークレットを指定するとデプロイが失敗するが、
          # 実注文や通知を有効にしたのに認証情報が無い状態は、そこで気付くべき設定漏れである。
          SECRET_MAPPINGS=""
          if [ "${REAL_TRADING_ENABLED_VALUE}" = "true" ]; then
            SECRET_MAPPINGS="GMO_API_KEY=gmo-api-key:latest,GMO_API_SECRET=gmo-api-secret:latest"
          fi
          if [ "${NOTIFICATION_ENABLED_VALUE}" = "true" ]; then
            if [ -n "${SECRET_MAPPINGS}" ]; then
              SECRET_MAPPINGS="${SECRET_MAPPINGS},"
            fi
            SECRET_MAPPINGS="${SECRET_MAPPINGS}NOTIFICATION_WEBHOOK_URL=notification-webhook-url:latest"
          fi

          SECRET_ARGS=()
          if [ -n "${SECRET_MAPPINGS}" ]; then
            echo "Secret Manager から渡す環境変数: $(echo "${SECRET_MAPPINGS}" | sed 's/=[^,]*:latest/=（シークレット）/g')"
            SECRET_ARGS=(--set-secrets "${SECRET_MAPPINGS}")
          else
            echo "Secret Manager から渡す環境変数はありません。"
          fi

          gcloud run jobs deploy ${{ vars.CLOUD_RUN_JOB_NAME }} \
            --image ${IMAGE_URI} \
            --region ${{ vars.GCP_REGION }} \
            --service-account ${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars "${ENV_VARS}" \
            "${SECRET_ARGS[@]}" \
            --add-volume=name=gcs,type=cloud-storage,bucket=${{ vars.GCS_BUCKET_NAME }},readonly=false \
            --add-volume-mount=volume=gcs,mount-path=/mnt/gcs \
            --tasks 1 \
            --max-retries 0

      - name: Verify Deployment
        run: |
          gcloud run jobs describe ${{ vars.CLOUD_RUN_JOB_NAME }} \
            --region ${{ vars.GCP_REGION }}

          echo "=== Env Vars ==="
          gcloud run jobs describe ${{ vars.CLOUD_RUN_JOB_NAME }} \
            --region ${{ vars.GCP_REGION }} \
            --format='yaml(template.template.containers[0].env)'

      - name: Execute Cloud Run Job (Optional)
        if: ${{ inputs.execute_after_deploy }}
        run: |
          gcloud run jobs execute ${{ vars.CLOUD_RUN_JOB_NAME }} \
            --region ${{ vars.GCP_REGION }} \
            --wait
