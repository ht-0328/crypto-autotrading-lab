name: Bootstrap Create GCP Resources

on:
  workflow_dispatch:

jobs:
  bootstrap-create:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Enable GCP APIs
        run: |
          echo "Enabling necessary GCP APIs..."
          gcloud services enable serviceusage.googleapis.com \
            iam.googleapis.com \
            iamcredentials.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            storage.googleapis.com

      - name: Create Artifact Registry
        run: |
          echo "Checking if Artifact Registry repository exists..."
          if gcloud artifacts repositories describe ${{ vars.ARTIFACT_REPOSITORY }} --location=${{ vars.GCP_REGION }} > /dev/null 2>&1; then
            echo "Artifact Registry repository already exists."
          else
            DESCRIBE_OUT=$(gcloud artifacts repositories describe ${{ vars.ARTIFACT_REPOSITORY }} --location=${{ vars.GCP_REGION }} 2>&1 || true)
            if echo "$DESCRIBE_OUT" | grep -q "NOT_FOUND"; then
              echo "Artifact Registry repository not found. Creating..."
              gcloud artifacts repositories create ${{ vars.ARTIFACT_REPOSITORY }} \
                --repository-format=docker \
                --location=${{ vars.GCP_REGION }}
            elif echo "$DESCRIBE_OUT" | grep -q "PERMISSION_DENIED"; then
              echo "Error: Permission denied to describe Artifact Registry. Please check your IAM roles."
              exit 1
            else
              echo "Error: An unexpected error occurred: $DESCRIBE_OUT"
              exit 1
            fi
          fi

      - name: Create GCS Bucket
        run: |
          echo "Checking if GCS Bucket exists..."
          if gcloud storage buckets describe gs://${{ vars.GCS_BUCKET_NAME }} > /dev/null 2>&1; then
            echo "GCS Bucket already exists."
          else
            DESCRIBE_OUT=$(gcloud storage buckets describe gs://${{ vars.GCS_BUCKET_NAME }} 2>&1 || true)
            if echo "$DESCRIBE_OUT" | grep -q "404" || echo "$DESCRIBE_OUT" | grep -q "does not exist"; then
              echo "GCS Bucket not found. Creating..."
              gcloud storage buckets create gs://${{ vars.GCS_BUCKET_NAME }} \
                --location=${{ vars.GCP_REGION }}
            elif echo "$DESCRIBE_OUT" | grep -q "403" || echo "$DESCRIBE_OUT" | grep -q "access to this bucket"; then
              echo "Error: Permission denied to describe GCS Bucket. Please check your IAM roles."
              exit 1
            else
              echo "Error: An unexpected error occurred: $DESCRIBE_OUT"
              exit 1
            fi
          fi

      - name: Create Cloud Build Service Account
        run: |
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          SA_EMAIL="${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}@${PROJECT_ID}.iam.gserviceaccount.com"
          echo "Checking if Cloud Build Service Account exists..."
          set +e
          EXISTING_EMAIL=$(gcloud iam service-accounts list \
            --project="${PROJECT_ID}" \
            --filter="email:${SA_EMAIL}" \
            --format="value(email)" 2>&1)
          STATUS=$?
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo "Error: サービスアカウント一覧の取得に失敗しました。"
            echo "Actual error: ${EXISTING_EMAIL}"
            exit 1
          fi

          if [ -z "${EXISTING_EMAIL}" ]; then
            echo "Service Account not found. Creating..."
            gcloud iam service-accounts create "${{ vars.BUILD_SERVICE_ACCOUNT_NAME }}" \
              --description="Service Account for Cloud Build" \
              --project="${PROJECT_ID}"
          else
            echo "Service Account already exists: ${EXISTING_EMAIL}"
          fi

      - name: Create Cloud Run Runtime Service Account
        run: |
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          SA_EMAIL="${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}@${PROJECT_ID}.iam.gserviceaccount.com"
          echo "Checking if Cloud Run Runtime Service Account exists..."
          set +e
          EXISTING_EMAIL=$(gcloud iam service-accounts list \
            --project="${PROJECT_ID}" \
            --filter="email:${SA_EMAIL}" \
            --format="value(email)" 2>&1)
          STATUS=$?
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo "Error: サービスアカウント一覧の取得に失敗しました。"
            echo "Actual error: ${EXISTING_EMAIL}"
            exit 1
          fi

          if [ -z "${EXISTING_EMAIL}" ]; then
            echo "Service Account not found. Creating..."
            gcloud iam service-accounts create "${{ vars.RUNTIME_SERVICE_ACCOUNT_NAME }}" \
              --description="Service Account for Cloud Run Job Runner" \
              --project="${PROJECT_ID}"
          else
            echo "Service Account already exists: ${EXISTING_EMAIL}"
          fi
