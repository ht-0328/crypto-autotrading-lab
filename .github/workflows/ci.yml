name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      # Phase1 では実注文を禁止しているため、dry-run の切り替えは提供しない。
      # CI は常に dry_run: true / real_trade_enabled: false で実行する。
      public_api_source:
        description: "Public APIの接続先"
        required: false
        type: choice
        options:
          - wiremock
          - real
        default: wiremock
      strategy_name:
        description: "使用する売買戦略"
        required: false
        type: choice
        options:
          - SafeReboundStrategy
          - CooldownReboundStrategy
          - TrendConfirmReboundStrategy
          - AtrTrendConfirmReboundStrategy
          - SimpleContrarianStrategy
        default: SafeReboundStrategy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # build にコンパイル・全単体テスト・Konsist の ArchitectureTest がすべて含まれる
      - name: Build and Test
        run: |
          cd projects/crypto-autotrading-app
          ./gradlew build

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: projects/crypto-autotrading-app/build/reports/tests/

  docker-run:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Network
        run: docker network create crypto-ci-net

      - name: Start WireMock
        run: |
          docker run -d --name wiremock --network crypto-ci-net -v ${{ github.workspace }}/mocks/wiremock:/home/wiremock wiremock/wiremock:3.5.2
          # Docker ネットワーク内で WireMock が起動するまで待つ
          for i in {1..10}; do
            if docker run --rm --network crypto-ci-net curlimages/curl:latest -s http://wiremock:8080/__admin/ > /dev/null; then
              echo "WireMock が起動しました"
              break
            fi
            echo "WireMock の起動を待機しています..."
            sleep 2
            if [ $i -eq 10 ]; then
              echo "WireMock の起動に失敗しました"
              exit 1
            fi
          done

      - name: Prepare CI Config
        run: |
          ci/prepare-ci-config.sh
        env:
          INPUT_PUBLIC_API_SOURCE: ${{ inputs.public_api_source }}
          INPUT_STRATEGY_NAME: ${{ inputs.strategy_name }}

      - name: Build Docker Image
        run: docker build -t crypto-app:ci -f docker/app/Dockerfile .

      - name: Setup Data Directory
        run: mkdir -p data

      - name: Run Application
        run: |
          # tee を挟むとアプリの終了コードが隠れるため、パイプの失敗を拾えるようにする
          set -o pipefail
          docker run --rm --network crypto-ci-net \
            -e APP_CONFIG_PATH="$APP_CONFIG_PATH" \
            -e APP_DATA_DIR=/app/data \
            -e APP_TRADING_STRATEGY_NAME="$APP_TRADING_STRATEGY_NAME" \
            -e API_PUBLIC_BASE_URL="$API_PUBLIC_BASE_URL" \
            -e API_PRIVATE_BASE_URL="$API_PRIVATE_BASE_URL" \
            -e REAL_TRADING_DRY_RUN="$REAL_TRADING_DRY_RUN" \
            -e REAL_TRADING_ENABLED="$REAL_TRADING_ENABLED" \
            -e REAL_TRADING_MAX_ORDER_JPY="$REAL_TRADING_MAX_ORDER_JPY" \
            -e REAL_TRADING_MAX_DAILY_ORDER_JPY="$REAL_TRADING_MAX_DAILY_ORDER_JPY" \
            -e REAL_TRADING_MAX_POSITION_JPY="$REAL_TRADING_MAX_POSITION_JPY" \
            -v ${{ github.workspace }}/config:/app/config:ro \
            -v ${{ github.workspace }}/data:/app/data \
            crypto-app:ci 2>&1 | tee ${{ github.workspace }}/data/app.log

      - name: Verify Outputs
        run: |
          echo "出力ファイルを確認します..."
          test -f ${{ github.workspace }}/data/state.json || (echo "state.json が見つかりません！" && exit 1)
          ls ${{ github.workspace }}/data/trades_*.csv > /dev/null 2>&1 || (echo "trades_*.csv が見つかりません！" && exit 1)
          echo "出力ファイルを確認しました。"

          # 出力ファイルの存在だけでは、モックのデータが壊れていても気付けない。
          # 市場データの検証で見送りになっていないことを確認し、売買経路が通ったことを保証する。
          echo "売買判定まで到達したかを確認します..."
          if grep -q "市場データの検証NG" ${{ github.workspace }}/data/app.log; then
            echo "市場データの検証に失敗しています。WireMock のスタブを確認してください。"
            grep "市場データの検証NG" ${{ github.workspace }}/data/app.log
            exit 1
          fi
          grep "Trade Decision:" ${{ github.workspace }}/data/app.log || (echo "売買判定のログが見つかりません！" && exit 1)
          echo "売買判定まで到達したことを確認しました。"


      - name: Upload Application Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-data-artifacts
          path: |
            data/app.log
            data/state.json
            data/trades_*.csv

      - name: Show Logs on Failure
        if: always()
        run: |
          echo "=== data/app.log ==="
          cat ${{ github.workspace }}/data/app.log 2>/dev/null || echo "data/app.log が見つかりません"
          echo "=== data/state.json ==="
          cat ${{ github.workspace }}/data/state.json 2>/dev/null || echo "data/state.json が見つかりません"
          echo "=== data/trades_*.csv ==="
          cat ${{ github.workspace }}/data/trades_*.csv 2>/dev/null || echo "CSV ファイルが見つかりません"
          echo "=== ls -la data ==="
          ls -la ${{ github.workspace }}/data 2>/dev/null || echo "data ディレクトリが見つかりません"

      - name: Cleanup Docker
        if: always()
        run: |
          docker stop wiremock || true
          docker rm wiremock || true
          docker network rm crypto-ci-net || true
