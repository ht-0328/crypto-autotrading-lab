name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      use_public_api:
        description: 'Use Public API (GMO)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Tests
        run: |
          cd projects/crypto-autotrading-app
          ./gradlew test

  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start WireMock
        if: ${{ inputs.use_public_api != true }}
        run: |
          docker run -d --network host -v ${{ github.workspace }}/mocks/wiremock:/home/wiremock wiremock/wiremock:3.5.2
          sleep 5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build shadowJar
        run: |
          cd projects/crypto-autotrading-app
          ./gradlew clean shadowJar
          cd ../..
          mkdir -p build/libs
          cp projects/crypto-autotrading-app/build/libs/*-all.jar build/libs/

      - name: Build Docker Image
        run: docker build -t crypto-app -f docker/app/Dockerfile .

      - name: Setup Data Directory
        run: mkdir -p data

      - name: Determine Config Path
        run: |
          if [ "${{ inputs.use_public_api }}" == "true" ]; then
            echo "APP_CONFIG_PATH=/app/config/application-gmo.yaml" >> $GITHUB_ENV
          else
            echo "APP_CONFIG_PATH=/app/config/application-ci.yaml" >> $GITHUB_ENV
          fi

      - name: Run Application
        run: |
          docker run --network host \
            -e APP_CONFIG_PATH=$APP_CONFIG_PATH \
            -e APP_DATA_DIR=/app/data \
            -v ${{ github.workspace }}/config:/app/config:ro \
            -v ${{ github.workspace }}/data:/app/data \
            crypto-app

      - name: Show Logs and Outputs
        if: always()
        run: |
          echo "=== data/app.log ==="
          cat ${{ github.workspace }}/data/app.log 2>/dev/null || echo "data/app.log not found"
          echo "=== data/state.json ==="
          cat ${{ github.workspace }}/data/state.json 2>/dev/null || echo "data/state.json not found"
          echo "=== data/*.csv ==="
          cat ${{ github.workspace }}/data/*.csv 2>/dev/null || echo "No CSV files found"
