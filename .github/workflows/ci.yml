name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-runモードで実行するか"
        required: false
        type: boolean
        default: true
      public_api_source:
        description: "Public APIの接続先"
        required: false
        type: choice
        options:
          - wiremock
          - real
        default: wiremock
      strategy_name:
        description: "使用する売買戦略"
        required: false
        type: choice
        options:
          - SafeReboundStrategy
          - SimpleContrarianStrategy
        default: SafeReboundStrategy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Build and Test
        run: |
          cd projects/crypto-autotrading-app
          ./gradlew build

      - name: Run Architecture Rule Tests
        run: |
          cd projects/crypto-autotrading-app
          ./gradlew test --tests "*Architecture*"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: projects/crypto-autotrading-app/build/reports/tests/

  docker-run:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Network
        run: docker network create crypto-ci-net

      - name: Start WireMock
        run: |
          docker run -d --name wiremock --network crypto-ci-net -v ${{ github.workspace }}/mocks/wiremock:/home/wiremock wiremock/wiremock:3.5.2
          # Wait for WireMock to be healthy within the Docker network
          for i in {1..10}; do
            if docker run --rm --network crypto-ci-net curlimages/curl:latest -s http://wiremock:8080/__admin/ > /dev/null; then
              echo "WireMock is up"
              break
            fi
            echo "Waiting for WireMock..."
            sleep 2
            if [ $i -eq 10 ]; then
              echo "Failed to start WireMock"
              exit 1
            fi
          done

      - name: Prepare CI Config
        run: |
          mkdir -p build/ci-config
          STRATEGY="${{ inputs.strategy_name || 'SafeReboundStrategy' }}"
          PUBLIC_API_SOURCE="${{ inputs.public_api_source || 'wiremock' }}"
          # `dry_run` is a boolean, so we need to be careful with string conversion.
          # For push/pull_request, input might be empty, so default to true.
          DRY_RUN="${{ inputs.dry_run }}"
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="true"
          fi

          echo "Using trading strategy: $STRATEGY"
          echo "Using Public API source: $PUBLIC_API_SOURCE"
          echo "Dry run: $DRY_RUN"

          # Use application-ci.yaml as base, but update its values
          CONFIG_PATH="build/ci-config/application-ci-docker.yaml"
          cp config/application-ci.yaml $CONFIG_PATH

          # Update strategy
          sed -i "s/strategy_name:.*/strategy_name: \"$STRATEGY\"/g" $CONFIG_PATH

          # Update API URLs
          if [ "$PUBLIC_API_SOURCE" == "real" ]; then
            sed -i "s|public_base_url:.*|public_base_url: \"https://api.coin.z.com/public\"|g" $CONFIG_PATH
          else
            sed -i "s|public_base_url:.*|public_base_url: \"http://wiremock:8080/public\"|g" $CONFIG_PATH
          fi
          sed -i "s|private_base_url:.*|private_base_url: \"http://wiremock:8080/private\"|g" $CONFIG_PATH

          # Update real_trading settings block
          # Since it might not exist in application-ci.yaml, we'll append it.
          if [ "$DRY_RUN" == "true" ]; then
            cat <<EOF >> $CONFIG_PATH

real_trading:
  dry_run: true
  real_trade_enabled: false
  stop_on_unconfirmed_order: true
  max_order_jpy: 1000
  max_daily_order_jpy: 1000
  max_position_jpy: 1000
EOF
          else
            cat <<EOF >> $CONFIG_PATH

real_trading:
  dry_run: false
  real_trade_enabled: true
  stop_on_unconfirmed_order: true
  max_order_jpy: 1000
  max_daily_order_jpy: 1000
  max_position_jpy: 1000
EOF
          fi

          echo "APP_CONFIG_PATH=/app/$CONFIG_PATH" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t crypto-app:ci -f docker/app/Dockerfile .

      - name: Setup Data Directory
        run: mkdir -p data

      - name: Run Application
        run: |
          docker run --rm --network crypto-ci-net \
            -e APP_CONFIG_PATH=$APP_CONFIG_PATH \
            -e APP_DATA_DIR=/app/data \
            -v ${{ github.workspace }}/config:/app/config:ro \
            -v ${{ github.workspace }}/build/ci-config:/app/build/ci-config:ro \
            -v ${{ github.workspace }}/data:/app/data \
            crypto-app:ci

      - name: Verify Outputs
        run: |
          echo "Verifying output files..."
          test -f ${{ github.workspace }}/data/state.json || (echo "state.json not found!" && exit 1)
          ls ${{ github.workspace }}/data/trades_*.csv > /dev/null 2>&1 || (echo "trades_*.csv not found!" && exit 1)
          echo "Output files verified successfully."

      - name: Verify WireMock Journal
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="true"
          fi
          PUBLIC_API_SOURCE="${{ inputs.public_api_source || 'wiremock' }}"

          if [ "$DRY_RUN" == "false" ] && [ "$PUBLIC_API_SOURCE" == "wiremock" ]; then
            echo "Verifying WireMock Private API calls..."
            JOURNAL=$(docker run --rm --network crypto-ci-net curlimages/curl:latest -s http://wiremock:8080/__admin/requests)

            echo "$JOURNAL" | grep -q "/private/v1/account/assets" || (echo "GET /private/v1/account/assets was not called" && exit 1)
            echo "$JOURNAL" | grep -q "/private/v1/activeOrders" || (echo "GET /private/v1/activeOrders was not called" && exit 1)
            echo "$JOURNAL" | grep -q "/private/v1/order" || (echo "POST /private/v1/order was not called" && exit 1)
            echo "All expected Private API calls were made to WireMock."
          else
            echo "Skipping WireMock Private API call verification (dry_run=$DRY_RUN, public_api_source=$PUBLIC_API_SOURCE)"
          fi

      - name: Upload Application Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-data-artifacts
          path: |
            data/app.log
            data/state.json
            data/trades_*.csv

      - name: Show Logs and Cleanup
        if: always()
        run: |
          echo "=== data/app.log ==="
          cat ${{ github.workspace }}/data/app.log 2>/dev/null || echo "data/app.log not found"
          echo "=== data/state.json ==="
          cat ${{ github.workspace }}/data/state.json 2>/dev/null || echo "data/state.json not found"
          echo "=== data/trades_*.csv ==="
          cat ${{ github.workspace }}/data/trades_*.csv 2>/dev/null || echo "No CSV files found"
          echo "=== ls -la data ==="
          ls -la ${{ github.workspace }}/data 2>/dev/null || echo "data directory not found"

          # Cleanup network and containers
          docker stop wiremock || true
          docker rm wiremock || true
          docker network rm crypto-ci-net || true
