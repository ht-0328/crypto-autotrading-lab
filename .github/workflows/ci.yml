name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      use_public_api:
        description: "Use Public API (GMO)"
        required: false
        type: boolean
        default: false
      strategy_name:
        description: "Trading strategy to use"
        required: false
        type: choice
        options:
          - SafeReboundStrategy
          - SimpleContrarianStrategy
        default: SafeReboundStrategy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Build and Test
        run: |
          cd projects/crypto-autotrading-app
          ./gradlew build

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: projects/crypto-autotrading-app/build/reports/tests/

  docker-run:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Network
        run: docker network create crypto-ci-net

      - name: Start WireMock
        if: ${{ inputs.use_public_api != true }}
        run: |
          docker run -d --name wiremock --network crypto-ci-net -v ${{ github.workspace }}/mocks/wiremock:/home/wiremock wiremock/wiremock:3.5.2
          # Wait for WireMock to be healthy within the Docker network
          for i in {1..10}; do
            if docker run --rm --network crypto-ci-net curlimages/curl:latest -s http://wiremock:8080/__admin/ > /dev/null; then
              echo "WireMock is up"
              break
            fi
            echo "Waiting for WireMock..."
            sleep 2
            if [ $i -eq 10 ]; then
              echo "Failed to start WireMock"
              exit 1
            fi
          done

      - name: Prepare CI Config
        run: |
          mkdir -p build/ci-config
          STRATEGY="${{ inputs.strategy_name || 'SafeReboundStrategy' }}"
          echo "Using trading strategy: $STRATEGY"

          if [ "${{ inputs.use_public_api }}" == "true" ]; then
            sed "s/strategy_name:.*/strategy_name: \"$STRATEGY\"/g" config/application-gmo.yaml > build/ci-config/application-gmo-docker.yaml
            echo "APP_CONFIG_PATH=/app/build/ci-config/application-gmo-docker.yaml" >> $GITHUB_ENV
          else
            # Create a temporary config that points to the WireMock container
            sed "s|http://localhost:8080|http://wiremock:8080|g" config/application-ci.yaml | \
            sed "s/strategy_name:.*/strategy_name: \"$STRATEGY\"/g" > build/ci-config/application-ci-docker.yaml
            echo "APP_CONFIG_PATH=/app/build/ci-config/application-ci-docker.yaml" >> $GITHUB_ENV
          fi

      - name: Build Docker Image
        run: docker build -t crypto-app:ci -f docker/app/Dockerfile .

      - name: Setup Data Directory
        run: mkdir -p data

      - name: Run Application
        run: |
          docker run --rm --network crypto-ci-net \
            -e APP_CONFIG_PATH=$APP_CONFIG_PATH \
            -e APP_DATA_DIR=/app/data \
            -v ${{ github.workspace }}/config:/app/config:ro \
            -v ${{ github.workspace }}/build/ci-config:/app/build/ci-config:ro \
            -v ${{ github.workspace }}/data:/app/data \
            crypto-app:ci

      - name: Verify Outputs
        run: |
          echo "Verifying output files..."
          test -f ${{ github.workspace }}/data/state.json || (echo "state.json not found!" && exit 1)
          ls ${{ github.workspace }}/data/trades_*.csv > /dev/null 2>&1 || (echo "trades_*.csv not found!" && exit 1)
          echo "Output files verified successfully."

      - name: Upload Application Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-data-artifacts
          path: |
            data/app.log
            data/state.json
            data/trades_*.csv

      - name: Show Logs and Cleanup
        if: always()
        run: |
          echo "=== data/app.log ==="
          cat ${{ github.workspace }}/data/app.log 2>/dev/null || echo "data/app.log not found"
          echo "=== data/state.json ==="
          cat ${{ github.workspace }}/data/state.json 2>/dev/null || echo "data/state.json not found"
          echo "=== data/trades_*.csv ==="
          cat ${{ github.workspace }}/data/trades_*.csv 2>/dev/null || echo "No CSV files found"
          echo "=== ls -la data ==="
          ls -la ${{ github.workspace }}/data 2>/dev/null || echo "data directory not found"

          # Cleanup network and containers
          docker stop wiremock || true
          docker rm wiremock || true
          docker network rm crypto-ci-net || true


  backtest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Data Directory
        run: |
          mkdir -p data/backtest/input
          mkdir -p data/backtest/output

      - name: Export K-lines CSV
        run: |
          cd projects/crypto-autotrading-app
          export APP_CONFIG_PATH=../../config/application-gmo.yaml
          export APP_DATA_DIR=../../data
          export KLINE_EXPORT_SYMBOL=BTC
          export KLINE_EXPORT_INTERVAL=5min
          export KLINE_EXPORT_START_DATE=20240101
          export KLINE_EXPORT_END_DATE=20240101
          export KLINE_EXPORT_OUTPUT_PATH=backtest/input/ci_btc_5min_20240101.csv
          ./gradlew exportKlinesCsv

      - name: Verify Exported K-lines CSV
        run: |
          cd projects/crypto-autotrading-app
          CSV_PATH="../../data/backtest/input/ci_btc_5min_20240101.csv"
          echo "Verifying $CSV_PATH..."
          if ! test -f "$CSV_PATH"; then
            echo "CSV not found"
            exit 1
          fi
          if ! head -n 1 "$CSV_PATH" | grep -q "openTime,open,high,low,close,volume"; then
            echo "Header missing"
            cat "$CSV_PATH" || true
            exit 1
          fi
          echo "K-lines CSV verified successfully."

      - name: Run Backtest
        run: |
          cd projects/crypto-autotrading-app
          export APP_CONFIG_PATH=../../config/application-gmo.yaml
          export APP_DATA_DIR=../../data
          export BACKTEST_KLINE_CSV_PATH=../../data/backtest/input/ci_btc_5min_20240101.csv
          export BACKTEST_STRATEGY_NAME=SafeReboundStrategy
          export BACKTEST_INITIAL_CAPITAL=10000
          export BACKTEST_SUMMARY_OUTPUT_PATH=../../data/backtest/output/ci_summary_btc_5min_20240101.csv
          export BACKTEST_STEPS_OUTPUT_PATH=../../data/backtest/output/ci_steps_btc_5min_20240101.csv
          ./gradlew runBacktest

      - name: Verify Backtest Outputs
        run: |
          cd projects/crypto-autotrading-app
          SUMMARY_PATH="../../data/backtest/output/ci_summary_btc_5min_20240101.csv"
          STEPS_PATH="../../data/backtest/output/ci_steps_btc_5min_20240101.csv"
          echo "Verifying $SUMMARY_PATH..."
          ls -la ../../data/backtest/output/ || true

          if ! test -f "$SUMMARY_PATH"; then
            echo "Summary not found"
            exit 1
          fi
          if ! head -n 1 "$SUMMARY_PATH" | grep -q "戦略名"; then
            echo "Summary header missing"
            cat "$SUMMARY_PATH" || true
            exit 1
          fi

          echo "Verifying $STEPS_PATH..."
          if ! test -f "$STEPS_PATH"; then
            echo "Steps not found"
            exit 1
          fi
          if ! head -n 1 "$STEPS_PATH" | grep -q "K線開始時刻"; then
            echo "Steps header missing"
            cat "$STEPS_PATH" || true
            exit 1
          fi

          echo "Backtest outputs verified successfully."

      - name: Upload Backtest Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-artifacts
          path: |
            data/app.log
            data/backtest/input/*.csv
            data/backtest/output/*.csv
