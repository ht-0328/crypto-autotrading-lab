services:
  app:
    build:
      context: ../../
      dockerfile: docker/app/Dockerfile
    container_name: crypto-autotrading
    # 1回実行して終了するバッチのため再起動はしない。
    # restart を付けると終了のたびに再実行され、APIを叩き続けることになる。
    restart: "no"
    environment:
      - APP_DATA_DIR=/app/data
      # 既定は WireMock 向け。本物の GMO API を使う場合は下の2つを上書きする
      - APP_CONFIG_PATH=/app/config/application-wiremock.yaml
      - API_PUBLIC_BASE_URL=${API_PUBLIC_BASE_URL:-http://wiremock:8080/public}
      - API_PRIVATE_BASE_URL=${API_PRIVATE_BASE_URL:-http://wiremock:8080/private}
    volumes:
      - ../../config:/app/config:ro
      - ../../data:/app/data
    depends_on:
      - wiremock

  wiremock:
    # CI (.github/workflows/ci.yml) と同じバージョンに固定する
    image: wiremock/wiremock:3.5.2
    container_name: crypto-autotrading-wiremock
    ports:
      - "8080:8080"
    volumes:
      - ../../mocks/wiremock:/home/wiremock
    command: ["--global-response-templating", "--disable-gzip"]
